name: Reviewbot

on:
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

jobs:
  manual_invocation:
    # Gate: only repo OWNER, MEMBER, or COLLABORATOR comments run this job; GitHub evaluates && and || strictly left-to-right, so the trailing && gates the whole expression.
    if: |
      startsWith(github.event.comment.body, '/reviewbot') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Run reviewbot
        # TODO pin this image by sha256 digest once known.
        uses: docker://ghcr.io/xe/x/reviewbot:latest
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_BASE: https://zohar.automuse.art/v1
          OPENAI_API_KEY: ${{ secrets.ZOHAR_API_KEY }}
          OPENAI_MODEL: gpt-oss-120b
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
