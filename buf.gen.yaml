version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: xeiaso.net/v4/gen
  disable:
    - module: buf.build/bufbuild/protovalidate
      file_option: go_package_prefix
    - module: buf.build/googleapis/googleapis
      file_option: go_package_prefix
    - module: buf.build/gnostic/gnostic
      file_option: go_package_prefix

plugins:
  - local: [go, tool, protoc-gen-go]
    out: gen
    opt:
      - paths=source_relative
  - local: [go, tool, protoc-gen-go-grpc]
    out: gen
    opt:
      - paths=source_relative
  - local: [go, tool, protoc-gen-connect-go]
    out: gen
    opt:
      - paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-openapi"]
    out: proto
    strategy: all
    opt:
      - path=openapi.yaml
      - format=yaml
      - path-prefix=/api
      - features=google.api.http;protovalidate;gnostic
      - content-types=json;proto
      - with-proto-annotations
      - with-proto-names
      - allowed-visibilities=PUBLIC
